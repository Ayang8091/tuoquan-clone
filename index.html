<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>乐道AI · 用户端</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=128"><link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=128">
<link rel="stylesheet" href="css/app.css?v=128">
</head>
<body>
<div id="phone"></div>
<div id="toast"></div>
<div class="sheet-mask" id="mask"></div>

<!-- 会员购买弹层 -->
<div class="sheet pay-sheet" id="paySheet">
  <span class="close-x" onclick="UI.closeSheet()">✕</span>
  <h3>开通年度老板会员</h3>
  <div class="price-line" id="payPrice">¥1980 / 年</div>
  <div class="sub">全年权益一次解锁 · 名额有限 · 开通后由主理人一对一对接</div>
  <div class="pay-item on" data-pay="微信支付"><span class="pi-ico">微</span>微信支付</div>
  <div class="pay-item" data-pay="对公转账"><span class="pi-ico" style="background:#4a63c8">公</span>对公转账（联系主理人）</div>
  <button class="btn-wechat" style="width:100%;margin-top:6px" onclick="User.payMember()">确认支付</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="js/data.js?v=128"></script>
<script src="js/cloud.js?v=128"></script>
<script src="js/upload.js?v=128"></script>
<script src="js/config.js?v=128"></script>
<script src="js/auth.js?v=128"></script>
<script src="js/app.js?v=128"></script>
<script src="js/workbench.js?v=128"></script>
<script src="js/distro.js?v=128"></script>
</body>
</html>
