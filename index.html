<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拓圈AI · 用户端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316385f'/%3E%3Ctext x='16' y='22' font-size='16' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'%3E拓%3C/text%3E%3C/svg%3E">

<body>
<div id="phone"></div>
<div id="toast"></div>
<div class="sheet-mask" id="mask"></div>

<!-- 会员购买弹层 -->
<div class="sheet pay-sheet" id="paySheet">
  <span class="close-x" onclick="UI.closeSheet()">✕</span>
  <h3>开通年度老板会员</h3>
  <div class="price-line" id="payPrice">¥1980 / 年</div>
  <div class="sub">全年权益一次解锁 · 名额有限 · 开通后由主理人一对一对接</div>
  <div class="pay-item on" data-pay="微信支付"><span class="pi-ico">微</span>微信支付</div>
  <div class="pay-item" data-pay="对公转账"><span class="pi-ico" style="background:#4a63c8">公</span>对公转账（联系主理人）</div>
  <button class="btn-wechat" style="width:100%;margin-top:6px" onclick="User.payMember()">确认支付</button>
</div>

<script src="js/data.js?v=102"></script>
<script src="js/config.js?v=102"></script>
<script src="js/auth.js?v=102"></script>
<script src="js/app.js?v=102"></script>
